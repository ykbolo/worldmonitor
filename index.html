<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MBTI">
    <meta name="theme-color" content="#f4f1e8" />
    <title data-static-home>MBTI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        padding: 2rem;
      }

      h1 {
        display: flex;
        margin: 0;
        color: #171717;
        font-size: 4rem;
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: 0;
      }

      h1 span:nth-child(1) {
        color: #d94f3d;
      }

      h1 span:nth-child(2) {
        color: #167d72;
      }

      h1 span:nth-child(3) {
        color: #2459a9;
      }

      h1 span:nth-child(4) {
        color: #e1a124;
      }

      @media (min-width: 480px) {
        h1 {
          font-size: 7rem;
        }
      }

      @media (min-width: 768px) {
        h1 {
          font-size: 10rem;
        }
      }

      @media (min-width: 1200px) {
        h1 {
          font-size: 14rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 aria-label="MBTI"><span>M</span><span>B</span><span>T</span><span>I</span></h1>
    </main>
  </body>
</html>
